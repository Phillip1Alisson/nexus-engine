version: '3.8'

services:
  # Microsserviço 1: Gateway de Redirecionamento Assíncrono (Node.js)
  nexus-gateway:
    build:
      context: ./nexus-gateway-node
      dockerfile: Dockerfile
    container_name: nexus-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=nexus-redis
      - REDIS_PORT=6379
    depends_on:
      - nexus-redis
    networks:
      - nexus-network

  # Microsserviço 2: Core Engine Contábil (PHP)
  nexus-core:
    build:
      context: ./nexus-core-php
      dockerfile: Dockerfile
    container_name: nexus-core
    environment:
      - DB_HOST=nexus-database
      - DB_PORT=5432
      - DB_DATABASE=nexus_db
      - DB_USERNAME=nexus_user
      - DB_PASSWORD=nexus_password
      - REDIS_HOST=nexus-redis
      - REDIS_PORT=6379
    depends_on:
      - nexus-database
      - nexus-redis
    networks:
      - nexus-network

  # Broker de Mensageria Compartilhado
  nexus-redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    volumes:
      - nexus_redis_data:/data
    networks:
      - nexus-network

  # Banco de Dados Relacional
  nexus-database:
    image: postgres:16-alpine
    container_name: nexus-database
    environment:
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_password
      POSTGRES_DB: nexus_db
    ports:
      - "5432:5432"
    volumes:
      - nexus_db_data:/var/lib/postgresql/data
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge

volumes:
  nexus-redis_data:
  nexus-db_data:
