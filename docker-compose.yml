version: '3.8'

services:
  # Broker de Mensageria compartilhado pelos dois microsserviços
  nexus-redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    volumes:
      - nexus_redis_data:/data
    networks:
      - nexus-network

  # Banco de dados relacional para persistência ACID do Core PHP
  nexus-database:
    image: postgres:16-alpine
    container_name: nexus-database
    environment:
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_password
      POSTGRES_DB: nexus_db
    ports:
      - "5432:5432"
    volumes:
      - nexus_db_data:/var/lib/postgresql/data
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge

volumes:
  nexus-redis_data:
  nexus-db_data:
